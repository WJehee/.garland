name: "Supply chain"
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v27
    # --locked fails instead of refreshing imports.lock, so a dependency change
    # without a matching audit, import or exemption fails the build.
    - run: nix shell nixpkgs#cargo nixpkgs#cargo-vet -c cargo vet --locked
    - run: nix shell nixpkgs#cargo nixpkgs#cargo-deny -c cargo deny check
