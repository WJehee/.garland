# Canonical high assurance clippy lints for Cargo.toml.
# The rust template ships this block by default; scratch projects strip it.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "allow"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
